[tox]
envlist = py{311,312,313,314}-django{111,22}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    AWS_DEFAULT_REGION = eu-west-1
commands =
    coverage run -m pytest {posargs}
    coverage report
deps =
    django111: Django>=1.11,<1.12
    django22: Django>=2.2,<2.3
extras = test

[testenv:format]
basepython = python3.13
deps = ruff
skip_install = true
commands =
    ruff format --check src tests
    ruff check src tests
