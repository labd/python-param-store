[tox]
envlist = py{311,312,313,314}-django{111,22}

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
setenv =
    AWS_DEFAULT_REGION = eu-west-1
commands = coverage run --parallel -m pytest {posargs}
deps =
    django111: Django>=1.11,<1.12
    django22: Django>=2.2,<2.3
extras = test

[testenv:coverage-report]
basepython = python3.13
deps = coverage[toml]
skip_install = true
commands =
    coverage combine
    coverage xml
    coverage report

[testenv:format]
basepython = python3.13
deps =
    black
    isort[toml]
skip_install = true
commands =
    isort --recursive --check-only src tests
    black --check src/ tests/
